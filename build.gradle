plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.sonarqube' version '6.2.0.5505'
    id 'jacoco'
}

group = 'com.calidadsoftware'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    jmhVersion = '1.37'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.openjdk.jmh:jmh-core:${jmhVersion}"
    testAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmhVersion}"
    testImplementation 'com.intuit.karate:karate-junit5:1.4.1'
}
jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    useJUnitPlatform()
    // Las pruebas de aceptacion (Karate) corren aparte en :acceptanceTest
    // para no mezclarlas con las unitarias ni afectar la cobertura JaCoCo/Sonar.
    exclude '**/acceptance/**'
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('acceptanceTest', Test) {
    description = 'Pruebas de aceptacion de la API con Karate.'
    group = 'verification'
    useJUnitPlatform()
    include '**/acceptance/**'
    shouldRunAfter tasks.named('test')
    outputs.upToDateWhen { false }
    // Karate escribe aqui los HTML / cucumber.json
    systemProperty 'karate.output.dir', "${layout.buildDirectory.get().asFile.path}/karate-reports"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true    // lo lee SonarCloud
        html.required = true   // lo abres tú en el navegador
    }
}

tasks.register('benchmark', JavaExec) {
    description = 'Ejecuta los benchmarks JMH (reemplaza al exec-maven-plugin del pom original).'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    mainClass = 'com.calidadsoftware.peliculas.benchmark.BenchmarkRunner'
    classpath = sourceSets.test.runtimeClasspath
}

sonar {
    properties {
        def osName = System.getProperty('os.name').toLowerCase()
        def osArch = System.getProperty('os.arch').toLowerCase()
        property 'sonar.scanner.os', osName.contains('win') ? 'windows' : (osName.contains('mac') ? 'macosx' : 'linux')
        property 'sonar.scanner.arch', (osArch.contains('aarch64') || osArch.contains('arm64')) ? 'aarch64' : 'x64'
        property 'sonar.projectKey', 'mateor32_peliculas-calidad-software'   // tu Project Key
        property 'sonar.organization', 'mateor32'                             // tu Organization Key
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.sources', 'src/main/java'
        property 'sonar.tests', 'src/test/java'
        property 'sonar.java.binaries', 'build/classes/java/main'
        property 'sonar.exclusions', '**/benchmark/**'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.coverage.exclusions', '**/benchmark/**,**/*Application.java'
        // Sonar Scanner requiere Java 21+. Como el proyecto corre con Java 17,
        // dejamos que el scanner descargue su propio JRE 21 (cacheado la 1a vez).
        property 'sonar.scanner.skipJreProvisioning', 'false'
    }
}
