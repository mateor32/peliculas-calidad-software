<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador de Peliculas</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background: radial-gradient(
          circle at top,
          #2b1055 0%,
          #0f0c29 60%,
          #050510 100%
        );
        color: #f2f2f2;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 16px;
      }

      header {
        text-align: center;
        margin-bottom: 32px;
      }

      header h1 {
        margin: 0;
        font-size: 2.4rem;
        background: linear-gradient(90deg, #ff6ec4, #7873f5);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      header p {
        color: #b8b3d9;
        margin-top: 6px;
      }

      .search-box {
        display: flex;
        gap: 10px;
        width: 100%;
        max-width: 480px;
      }

      .search-box input {
        flex: 1;
        padding: 14px 18px;
        border-radius: 999px;
        border: 1px solid #4a4370;
        background: #1a1533;
        color: #fff;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .search-box input:focus {
        border-color: #7873f5;
      }

      .search-box button {
        padding: 14px 26px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(90deg, #ff6ec4, #7873f5);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.15s,
          opacity 0.15s;
      }

      .search-box button:hover {
        transform: translateY(-1px);
      }

      .search-box button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .result-area {
        margin-top: 40px;
        width: 100%;
        max-width: 480px;
        display: flex;
        justify-content: center;
      }

      .card {
        background: #171233;
        border: 1px solid #322b5c;
        border-radius: 20px;
        padding: 24px;
        width: 100%;
        display: flex;
        gap: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        animation: fadeIn 0.3s ease;
      }

      .card img {
        width: 120px;
        height: 178px;
        object-fit: cover;
        border-radius: 12px;
        background: #322b5c;
        flex-shrink: 0;
      }

      .card .info h2 {
        margin: 0 0 8px 0;
        font-size: 1.3rem;
      }

      .card .info p {
        margin: 4px 0;
        color: #b8b3d9;
        font-size: 0.92rem;
      }

      .badge {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 12px;
        border-radius: 999px;
        background: #3a3170;
        color: #d9d5ff;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .message {
        text-align: center;
        padding: 20px 28px;
        border-radius: 16px;
        max-width: 480px;
        width: 100%;
      }

      .message.error {
        background: #3a1030;
        border: 1px solid #6b1e4f;
        color: #ffb4dc;
      }

      .message.loading {
        color: #b8b3d9;
      }

      .message.hint {
        color: #7c76a8;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      footer {
        margin-top: auto;
        padding-top: 40px;
        color: #5c5686;
        font-size: 0.8rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎬 Buscador de Peliculas</h1>
      <p>Proyecto de Calidad de Software &mdash; datos vía OMDb</p>
    </header>

    <form class="search-box" id="search-form">
      <input
        type="text"
        id="title-input"
        placeholder="Ej: Matrix, Inception, Titanic..."
        autocomplete="off"
      />
      <button type="submit" id="search-btn">Buscar</button>
    </form>

    <div class="result-area" id="result-area">
      <p class="message hint">Escribe un titulo y presiona Buscar.</p>
    </div>

    <footer>GET /movies/search?title=... &middot; Spring Boot backend</footer>

    <script>
      const form = document.getElementById("search-form");
      const input = document.getElementById("title-input");
      const button = document.getElementById("search-btn");
      const resultArea = document.getElementById("result-area");

      function renderMessage(text, type) {
        resultArea.innerHTML = `<p class="message ${type}">${text}</p>`;
      }

      function renderMovie(movie) {
        // El backend serializa el modelo Movie usando los nombres de campo de OMDb (Title, Year, etc.)
        const poster =
          movie.Poster && movie.Poster !== "N/A"
            ? movie.Poster
            : "https://via.placeholder.com/120x178/322b5c/ffffff?text=Sin+poster";

        resultArea.innerHTML = `
                <div class="card">
                    <img src="${poster}" alt="Poster de ${movie.Title}" />
                    <div class="info">
                        <h2>${movie.Title}</h2>
                        <p>Anio: ${movie.Year}</p>
                        <p>IMDB ID: ${movie.imdbID}</p>
                        <span class="badge">${movie.Type}</span>
                    </div>
                </div>`;
      }

      async function searchMovie(title) {
        button.disabled = true;
        renderMessage("Buscando...", "loading");

        try {
          const response = await fetch(
            `/movies/search?title=${encodeURIComponent(title)}`,
          );
          const data = await response.json();

          if (response.ok) {
            renderMovie(data);
          } else {
            renderMessage(
              data.message || "Ocurrio un error inesperado.",
              "error",
            );
          }
        } catch (err) {
          renderMessage("No se pudo conectar con el servidor.", "error");
        } finally {
          button.disabled = false;
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const title = input.value.trim();
        if (!title) {
          renderMessage("Escribe un titulo antes de buscar.", "error");
          return;
        }
        searchMovie(title);
      });
    </script>
  </body>
</html>
